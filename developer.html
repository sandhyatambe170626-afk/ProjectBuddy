<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ProjectBuddy Developers</title>

<style>

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(to right, #e3f2fd, #f3e5f5);
    text-align:center;
}

.header{
    display:flex;
    background:#7db3bd;
    justify-content:center;
    align-items:center;
    gap:20px;
    padding:40px 0;
}

.header img{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
}

.text h1{
    margin:0;
    font-size:45px;
    font-weight:800;
    letter-spacing:1px;
    color:#1e2a38;
}

.text p{
    margin:5px 0 0;
    font-size:20px;
    color:#1e2a38;
}

.home-link{
    text-decoration:none;
    color:inherit;
    display:block;
}

.developer-row{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:nowrap;
    padding:40px 20px 60px;
}

.dev-card{
    background:white;
    width:300px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    padding:25px 10px 20px;
    transition:0.3s;
}

.dev-card:hover{
    transform:translateY(-10px);
}

.dev-card img{
    width:220px;
    height:260px;
    object-fit:contain;
    margin:0 auto 15px;
    display:block;
    border-radius:20px;
    border:2px solid #7db3bd;
    background:#f5f5f5;
}

.dev-card h3{
    margin:10px 0 5px;
    font-size:20px;
    color:#333;
    font-weight:600;
}

.role{
    font-size:15px;
    color:#5b7b91;
}

@media (max-width:768px){

    .header{
        flex-direction:column;
        padding:25px 10px;
    }

    .header img{
        width:90px;
        height:90px;
    }

    .text h1{
        font-size:28px;
    }

    .text p{
        font-size:16px;
    }

    .developer-row{
        flex-direction:column;
        align-items:center;
    }

    .dev-card{
        width:90%;
    }

    .dev-card img{
        width:100%;
        height:auto;
        object-fit:contain;
    }
}

</style>
</head>

<body>

<a href="index.html" class="home-link">
<div class="header">
    <img src="image/logo.jpeg" alt="ProjectBuddy Logo">
    <div class="text">
        <h1>ProjectBuddy</h1>
        <p>Student Collaboration Hub</p>
    </div>
</div>
</a>

<h3>Project Buddy (student project hub)</h3>
<h2>Maharshi Karve Mahila Mahavidyalya Satara's</h2>
<h3>Developer Team 2026</h3>

<div class="developer-row">

<div class="dev-card">
<img src="image/vedika.png">
<h3>Vedika Shinde</h3>
</div>

<div class="dev-card">
<img src="image/sandhya.jpg">
<h3>Sandhya Tambe</h3>
</div>

<div class="dev-card">
<img src="image/dhanashree.jpeg">
<h3>Dhanashree Shinde</h3>
</div>

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>ProjectBuddy</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css"/>

<style>
 

        body{
            font-family: Arial, sans-serif;
            margin: 0;
            padding:0px;
            background:#7db3bd;
        }
.header{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    padding-top:40px;
}

.header img{
    width:120px;
    height:120px;
    border-radius:150%;
    object-fit:contain;
}

.text h1{
    margin:0;
    font-size:45px;
    font-weight:800;
    letter-spacing:1px;
    color:#1e2a38;
}

.text p{
    margin:5px 0 0;
    font-size:20px;
    text-align: center;
    color:#1e2a38;

}

        .image-container{
         display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
        padding: 40px;             
        max-width: 1000px;         
        margin: 0 auto;            
        justify-items: center;     
        }

  .image-container img {
    width: 100%;
    max-width: 250px;          
    height: auto;
   }

        .card:hover{
            transform: scale(1.05);
        }

        .img{
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        @media(max-width: 768px){
            .image-container{
                grid-template-columns: repeat(2, 1fr);
            }
        }

footer{
  background:#078095;
  width:100%;
  color:#fff;
  margin-top:40px;
}

footer .content{
  max-width:1250px;
  margin:auto;
  padding:5px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  flex-wrap:wrap;
}

.logo-details{
  font-size:28px;
  font-weight:500;
}

.media-icons a{
  height:40px;
  width:40px;
  margin:10px;
  border-radius:50%;
  background:rgba(255,255,255,0.2);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  transition:0.3s;
}

.media-icons a:hover{
  background:#fff;
  color:#078095;
}
.link-boxes{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
}
.box{
  width:auto;               

}

.box .link_name{
  display:none;             
}

.box{
  display:flex;
  gap:30px;                
}

.box li{
  list-style:none;
}
.box li a{
  color:#fff;
  text-decoration:none;
  opacity:0.8;
  transition:0.3s;
}

.box li a:hover{
  opacity:1;
  text-decoration:underline;
}

.input-box input{
  height:40px;
  width:100%;
  margin:5px 0;
  border-radius:4px;
  border:none;
  padding:0 10px;
}

.input-box input[type="button"]{
  background:#fff;
  color:#078095;
  font-weight:600;
  cursor:pointer;
}

.bottom-details{
  background:#067282;
  padding:15px 40px;
}

.bottom_text{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  font-size:14px;
}

.bottom_text a{
  color:#fff;
  margin-left:10px;
  text-decoration:none;
}

.bottom_text a:hover{
  text-decoration:underline;
}

@media (max-width:768px){
  .top{
    flex-direction:column;
    text-align:center;
  }

  .link-boxes{
    flex-direction:column;
  }

  .box{
    width:100%;
    margin-bottom:20px;
  }

  .bottom_text{
    flex-direction:column;
    text-align:center;
  }
}

    </style>

</head>
<body>

<div class="header">
    <img src="image/logo.jpeg" alt="ProjectBuddy Logo">

    <div class="text">
        <h1>ProjectBuddy</h1>
        <p>Student Collaboration Hub</p>
    </div>
</div>

<div class="image-container">

      <div class="card" onclick="openPage('section.html')">
          <img src="image/section flower 1.png">
      </div>

      <div class="card" onclick="openPage('about.html')">
          <img src="image/about us 2.png">
      </div>

      <div class="card" onclick="openPage('resources.html')">
          <img src="image/resources 3.png">
      </div>

      <div class="card" onclick="openPage('services.html')">
          <img src="image/services 4.png">
      </div>

    <div class="card" onclick="openPage('tasks.html')">
        <img src="image/tasks 5.png">
    </div>

   <div class="card" onclick="openPage('signin.html')">
        <img src="image/explore projects 6.png">
    </div>

    <div class="card" onclick="openPage('contactus.html')">
        <img src="image/contact us flower.png">
    </div>

    <div class="card" onclick="openPage('blog.html')">
        <img src="image/blog flower.png">
    </div>

 <div class="card" onclick="openPage('faq.html')">
        <img src="image/faq flower.png">
    </div>

<div class="card" onclick="openPage('admin.html')">
        <img src="image/admin.png">
    </div>

<div class="card" onclick="openPage('latest announcement.html')">
        <img src="image/latest announcement.png">
    </div>

<div class="card" onclick="openPage('developer.html')">
        <img src="image/developers.png">
    </div>

</div>

<footer>
  <div class="content">

    <div class="top">
      <div class="logo-details">
         <span class="logo_name">ProjectBuddy</span>
      </div>

      <div class="media-icons">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-linkedin-in"></i></a>
        <a href="#"><i class="fab fa-youtube"></i></a>
      </div>
    </div>

    <div class="link-boxes">

      <ul class="box">
        <li class="link_name">Website</li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="signin.html">Login</a></li>
        <li><a href="contactus.html">Contact</a></li>
        <li><a href="admin.html">Admin</a></li>

        <li class="link_name">Account</li>
        <li><a href="faq.html">FAQ</a></li>
        <li><a href="blog.html">Blogs</a></li>
      </ul>

    
    </div>
  </div>

  <div class="bottom-details">
    <div class="bottom_text">
      <span>
        Copyright © 2026 ProjectBuddy. All rights reserved
      </span>
      <span>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms & Conditions</a>
      </span>
    </div>
  </div>

</footer>
<script>
    function openPage(pageName){
        window.location.href = pageName;
    }
</script>

</body>
</html>

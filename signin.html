    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
       body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
background: linear-gradient(to right, #e3f2fd, #f3e5f5);
}

.header{
    display:flex;
background:#7db3bd;
    justify-content:center;
    align-items:center;
    gap:20px;
    padding-top:40px;
padding-bottom:20px;
}

.header img{
    width:120px;
    height:120px;
    border-radius:150%;
    object-fit:contain;
}

.text h1{
    margin:0;
    font-size:45px;
    font-weight:800;
    letter-spacing:1px;
    color:#1e2a38;
}

.text p{
    margin:5px 0 0;
    font-size:20px;
    text-align: center;
    color:#1e2a38;
}

.home-link{
    text-decoration: none;
    color: inherit;
    display: block;
}

.main-container{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
margin-top:30px;
}

        .auth-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 2.5rem 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
            transition: all 0.3s ease;
        }
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            background: #f1f5f9;
            padding: 0.25rem;
            border-radius: 2rem;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 0.75rem 0;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            border-radius: 2rem;
            transition: all 0.2s;
        }
        .tab.active {
            background: white;
            color: #4f46e5;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.2);
        }
        .auth-form {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .auth-form.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0.3; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .input-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: #334155;
            margin-bottom: 0.3rem;
        }
        input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 1rem;
            font-size: 1rem;
            outline: none;
            transition: 0.15s;
            background: white;
        }
        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }
        .btn {
            width: 100%;
            padding: 0.9rem;
            background: #4f46e5;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            border-radius: 1rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 16px -4px rgba(79, 70, 229, 0.4);
        }
        .btn:hover {
            background: #4338ca;
            transform: scale(1.02);
        }
        .error-message {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 0.8rem;
            text-align: center;
            background: #fee2e2;
            padding: 0.5rem;
            border-radius: 0.75rem;
            display: none;
        }
        .info-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #64748b;
        }

footer{
  background:#078095;
  width:100%;
  color:#fff;
  margin-top:40px;
}

footer .content{
  max-width:1250px;
  margin:auto;
  padding:5px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  flex-wrap:wrap;
}

.logo-details{
  font-size:28px;
  font-weight:500;
}

.media-icons a{
  height:40px;
  width:40px;
  margin:10px;
  border-radius:50%;
  background:rgba(255,255,255,0.2);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  transition:0.3s;
}

.media-icons a:hover{
  background:#fff;
  color:#078095;
}

.link-boxes{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
}

.box{
  width:auto;               
}

.box .link_name{
  display:none;             
}

.box{
  display:flex;
  gap:30px;                
}

.box li{
  list-style:none;
}

.box li a{
  color:#fff;
  text-decoration:none;
  opacity:0.8;
  transition:0.3s;
}

.box li a:hover{
  opacity:1;
  text-decoration:underline;
}

.input-box input{
  height:40px;
  width:100%;
  margin:5px 0;
  border-radius:4px;
  border:none;
  padding:0 10px;
}

.input-box input[type="button"]{
  background:#fff;
  color:#078095;
  font-weight:600;
  cursor:pointer;
}

.bottom-details{
  background:#067282;
  padding:15px 40px;
}

.bottom_text{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  font-size:14px;
}

.bottom_text a{
  color:#fff;
  margin-left:10px;
  text-decoration:none;
}

.bottom_text a:hover{
  text-decoration:underline;
}

@media (max-width:768px){
  .top{
    flex-direction:column;
    text-align:center;
  }

  .link-boxes{
    flex-direction:column;
  }

  .box{
    width:100%;
    margin-bottom:20px;
  }

  .bottom_text{
    flex-direction:column;
    text-align:center;
  }
}

</head>
<body>
<a href="index.html" class="home-link">
<div class="header">
    <img src="image/logo.jpeg" alt="ProjectBuddy Logo">
        <div class="text">
        <h1>ProjectBuddy</h1>
        <p>Student Collaboration Hub</p>
    </div>
</div>
</a>

<div class="main-container">
    <div class="auth-container">       
 <div class="tabs">
            <div class="tab active" id="tabSignIn">Sign In</div>
            <div class="tab" id="tabSignUp">Sign Up</div>
        </div>

        <div class="auth-form active" id="signInForm">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="signinEmail" placeholder="michael@example.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="signinPassword" placeholder="••••••••">
            </div>
            <button class="btn" id="signInBtn">Sign In</button>
            <div class="error-message" id="signinError"></div>
        </div>

        <div class="auth-form" id="signUpForm">
            <div class="input-group">
                <label>Display Name</label>
                <input type="text" id="signupName" placeholder="John Doe">
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="signupEmail" placeholder="john@example.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="Min. 6 characters">
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="signupConfirmPassword" placeholder="••••••••">
            </div>
            <button class="btn" id="signUpBtn">Sign Up</button>
            <div class="error-message" id="signupError"></div>
        </div>
        <div class="info-text">Secure authentication with Firebase</div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js';
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword,
            updateProfile,
            onAuthStateChanged 
        } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCmn1FoHjGE573KKGxYCXnENAvLPwQpDl8",
            authDomain: "projectbuddy-2d19a.firebaseapp.com",
            projectId: "projectbuddy-2d19a",
            storageBucket: "projectbuddy-2d19a.firebasestorage.app",
            messagingSenderId: "620666475411",
            appId: "1:620666475411:web:074cccd91cb44d4a508e66"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'explore projects.html';
            }
        });

        const tabSignIn = document.getElementById('tabSignIn');
        const tabSignUp = document.getElementById('tabSignUp');
        const signInForm = document.getElementById('signInForm');
        const signUpForm = document.getElementById('signUpForm');

        tabSignIn.addEventListener('click', () => {
            tabSignIn.classList.add('active');
            tabSignUp.classList.remove('active');
            signInForm.classList.add('active');
            signUpForm.classList.remove('active');
        });

        tabSignUp.addEventListener('click', () => {
            tabSignUp.classList.add('active');
            tabSignIn.classList.remove('active');
            signUpForm.classList.add('active');
            signInForm.classList.remove('active');
        });

        document.getElementById('signInBtn').addEventListener('click', async () => {
            const email = document.getElementById('signinEmail').value.trim();
            const password = document.getElementById('signinPassword').value;
            const errorDiv = document.getElementById('signinError');
            
            errorDiv.style.display = 'none';
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
            }
        });

        document.getElementById('signUpBtn').addEventListener('click', async () => {
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirmPassword').value;
            const errorDiv = document.getElementById('signupError');

            errorDiv.style.display = 'none';

            if (!name || !email || !password || !confirm) {
                errorDiv.textContent = 'Please fill in all fields.';
                errorDiv.style.display = 'block';
                return;
            }
            if (password !== confirm) {
                errorDiv.textContent = 'Passwords do not match.';
                errorDiv.style.display = 'block';
                return;
            }
            if (password.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters.';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, { displayName: name });
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
            }
        });

        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (signInForm.classList.contains('active')) {
                    document.getElementById('signInBtn').click();
                } else {
                    document.getElementById('signUpBtn').click();
                }
            }
        }));
    </script>
    </div>
